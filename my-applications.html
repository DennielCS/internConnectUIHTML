<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternConnect | My Applications</title>
    <script>
      tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
    <div class="app-shell flex">
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full bg-white p-4 shadow-sm transition-transform dark:bg-slate-900 md:static md:translate-x-0">
        <h2 class="mb-6 text-lg font-bold">InternConnect</h2>
        <nav class="space-y-2">
          <a class="sidebar-link" href="./student-dashboard.html">Dashboard</a>
          <a class="sidebar-link" href="./internships.html">Browse Internships</a>
          <a class="sidebar-link active" href="./my-applications.html">My Applications</a>
          <a class="sidebar-link" href="./login.html">Logout</a>
        </nav>
      </aside>
      <section class="min-w-0 flex-1">
        <header class="sticky top-0 z-20 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 dark:border-slate-700 dark:bg-slate-900">
          <button id="sidebarToggle" class="rounded-lg border border-slate-300 px-3 py-1 text-sm md:hidden dark:border-slate-600">Menu</button>
          <h1 class="font-semibold">My Applications</h1>
        </header>
        <main class="p-4">
          <section class="overflow-hidden rounded-2xl bg-white dark:bg-slate-900">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-100 dark:bg-slate-800">
                <tr><th class="px-4 py-3">Company</th><th class="px-4 py-3">Role</th><th class="px-4 py-3">Submitted</th><th class="px-4 py-3">Status</th></tr>
              </thead>
              <tbody>
                <tr class="border-t border-slate-200 dark:border-slate-700"><td class="px-4 py-3">CodeNest Solutions</td><td class="px-4 py-3">Frontend Intern</td><td class="px-4 py-3">Apr 10, 2026</td><td class="px-4 py-3"><span class="rounded-full bg-amber-100 px-2 py-1 text-xs text-amber-700">For Review</span></td></tr>
                <tr class="border-t border-slate-200 dark:border-slate-700"><td class="px-4 py-3">BluePixel Studio</td><td class="px-4 py-3">UI/UX Intern</td><td class="px-4 py-3">Apr 6, 2026</td><td class="px-4 py-3"><span class="rounded-full bg-green-100 px-2 py-1 text-xs text-green-700">Interview</span></td></tr>
              </tbody>
            </table>
          </section>
        </main>
      </section>
    </div>
    <script>
      (function () {
        const sidebar = document.getElementById("sidebar");
        const sidebarToggle = document.getElementById("sidebarToggle");
        if (sidebar && sidebarToggle) {
          sidebarToggle.addEventListener("click", () => {
            sidebar.classList.toggle("-translate-x-full");
          });
        }
      })();
    </script>
  </body>
</html>
