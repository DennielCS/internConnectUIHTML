<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternConnect - Internship Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="font-bold text-2xl tracking-wider">InternConnect</div>
                <div class="hidden md:flex space-x-8">
                    <a href="browse.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Browse</a>
                    <a href="tracker.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">My Applications</a>
                    <a href="dashboard.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <a href="browse.html" class="text-blue-600 text-sm hover:underline">&larr; Back to listings</a>
        <div id="detailContainer" class="mt-4">
            <p class="text-gray-400 animate-pulse">Loading...</p>
        </div>
    </main>

    <script>
        const API = 'http://127.0.0.1:8000/api';
        const id  = new URLSearchParams(window.location.search).get('id');
        if (!id) location.href = 'browse.html';

        async function loadDetail() {
            const res  = await fetch(`${API}/internships/${id}/`);
            const data = await res.json();
            document.getElementById('detailContainer').innerHTML = `
                <div class="bg-white rounded-xl shadow p-8 mt-4 border border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-900 mb-1">${data.title}</h2>
                    <p class="text-gray-500 mb-4">${data.company_name} &bull; ${data.location}</p>
                    <div class="flex flex-wrap gap-2 mb-6 text-sm">
                        <span class="bg-blue-50 text-blue-700 px-3 py-1 rounded-full">${data.category_name}</span>
                        <span class="bg-green-50 text-green-700 px-3 py-1 rounded-full">${data.work_setup_label}</span>
                        <span class="bg-yellow-50 text-yellow-700 px-3 py-1 rounded-full">⏱ ${data.duration}</span>
                        <span class="bg-gray-100 text-gray-600 px-3 py-1 rounded-full">${data.slots} slot(s)</span>
                    </div>
                    <div class="mb-5">
                        <h3 class="font-semibold text-gray-800 mb-2">Description</h3>
                        <p class="text-gray-600 leading-relaxed">${data.description}</p>
                    </div>
                    <div class="mb-5">
                        <h3 class="font-semibold text-gray-800 mb-2">Requirements</h3>
                        <p class="text-gray-600 leading-relaxed">${data.requirements}</p>
                    </div>
                    <p class="text-sm text-red-500 mb-6">Application Deadline: <b>${data.deadline}</b></p>
                    <a href="apply.html?id=${data.id}"
                       class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-semibold transition">
                        Apply Now
                    </a>
                </div>
            `;
        }
        loadDetail();
    </script>
</body>
</html>
