<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternConnect - Apply</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="font-bold text-2xl tracking-wider">InternConnect</div>
                <div class="hidden md:flex space-x-8">
                    <a href="browse.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Browse</a>
                    <a href="tracker.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">My Applications</a>
                    <a href="dashboard.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <a href="browse.html" class="text-blue-600 text-sm hover:underline">&larr; Back to listings</a>
        <h2 class="text-2xl font-bold text-gray-800 mt-4 mb-1">Apply for Internship</h2>
        <p id="listingTitle" class="text-gray-500 mb-6"></p>

        <div id="formMsg" class="hidden mb-4 px-4 py-3 rounded-lg text-sm"></div>

        <form id="applyForm" class="bg-white rounded-xl shadow p-6 space-y-4 border border-gray-100">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input name="student_name" type="text" required
                       class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Student Number</label>
                <input name="student_number" type="text" required
                       class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input name="student_email" type="email" required
                       class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Cover Letter</label>
                <textarea name="cover_letter" rows="4"
                          class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Resume (PDF)</label>
                <input name="resume" type="file" accept=".pdf"
                       class="w-full border rounded-lg px-3 py-2" />
            </div>
            <input type="hidden" name="listing" id="listingId" />
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 font-semibold transition">
                Submit Application
            </button>
        </form>
    </main>

    <script>
        const API = 'http://127.0.0.1:8000/api';
        const id  = new URLSearchParams(window.location.search).get('id');
        if (!id) location.href = 'browse.html';
        document.getElementById('listingId').value = id;

        fetch(`${API}/internships/${id}/`)
            .then(r => r.json())
            .then(d => {
                document.getElementById('listingTitle').textContent = `${d.title} @ ${d.company_name}`;
            });

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msgDiv = document.getElementById('formMsg');
            const btn    = e.target.querySelector('button[type=submit]');
            btn.disabled    = true;
            btn.textContent = 'Submitting...';
            try {
                const formData = new FormData(e.target);
                const res = await fetch(`${API}/applications/`, {
                    method: 'POST',
                    body: formData,
                });
                if (!res.ok) throw new Error(JSON.stringify(await res.json()));
                msgDiv.textContent = '✓ Application submitted! Redirecting to tracker...';
                msgDiv.className   = 'mb-4 px-4 py-3 rounded-lg text-sm bg-green-50 text-green-700';
                msgDiv.classList.remove('hidden');
                e.target.reset();
                setTimeout(() => location.href = 'tracker.html', 1800);
            } catch (err) {
                msgDiv.textContent = 'Error: ' + err.message;
                msgDiv.className   = 'mb-4 px-4 py-3 rounded-lg text-sm bg-red-50 text-red-700';
                msgDiv.classList.remove('hidden');
            } finally {
                btn.disabled    = false;
                btn.textContent = 'Submit Application';
            }
        });
    </script>
</body>
</html>
