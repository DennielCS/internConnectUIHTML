<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InternConnect - My Applications</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 font-sans">

    <nav class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="font-bold text-2xl tracking-wider">InternConnect</div>
                <div class="hidden md:flex space-x-8">
                    <a href="browse.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Browse</a>
                    <a href="tracker.html" class="text-white hover:text-blue-300 px-3 py-2 rounded-md font-medium transition">My Applications</a>
                    <a href="dashboard.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md font-medium transition">Dashboard</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <h2 class="text-3xl font-extrabold text-gray-900 mb-2">My Applications</h2>
        <p class="text-gray-500 mb-8">Enter your email to track your application status.</p>

        <div class="bg-white rounded-xl shadow p-5 mb-6 flex gap-3 border border-gray-100">
            <input id="lookupEmail" type="email" placeholder="Enter your email address"
                   class="flex-1 border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
            <button onclick="trackApplications()"
                    class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 font-semibold transition">
                Search
            </button>
        </div>

        <div id="appsContainer"></div>
    </main>

    <script>
        const API = 'http://127.0.0.1:8000/api';

        const statusColors = {
            'Pending':      'bg-yellow-100 text-yellow-700',
            'Under Review': 'bg-blue-100 text-blue-700',
            'Accepted':     'bg-green-100 text-green-700',
            'Rejected':     'bg-red-100 text-red-700',
        };

        async function trackApplications() {
            const email     = document.getElementById('lookupEmail').value.trim();
            const container = document.getElementById('appsContainer');
            if (!email) { alert('Please enter your email address.'); return; }

            container.innerHTML = '<p class="text-gray-400 animate-pulse">Searching...</p>';

            const res  = await fetch(`${API}/applications/track/?email=${encodeURIComponent(email)}`);
            const data = await res.json();

            if (!data.length) {
                container.innerHTML = '<p class="text-gray-400">No applications found for this email.</p>';
                return;
            }
            container.innerHTML = data.map(a => `
                <div class="bg-white rounded-xl shadow p-5 mb-4 border border-gray-100">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-gray-800">${a.listing_title}</h3>
                            <p class="text-gray-500 text-sm">${a.company_name}</p>
                        </div>
                        <span class="text-xs font-semibold px-3 py-1 rounded-full ${statusColors[a.status_label] || 'bg-gray-100 text-gray-600'}">
                            ${a.status_label}
                        </span>
                    </div>
                    <p class="text-xs text-gray-400 mt-3">
                        Applied: ${new Date(a.applied_at).toLocaleDateString()}
                        &nbsp;|&nbsp;
                        Last Updated: ${new Date(a.updated_at).toLocaleDateString()}
                    </p>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
