<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternConnect | Login</title>
    <script>
      tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="grid min-h-screen place-items-center bg-slate-100 p-4 dark:bg-slate-950">
    <section class="w-full max-w-md rounded-2xl bg-white p-6 shadow-lg dark:bg-slate-900">
      <div class="mb-5 flex items-center justify-between">
        <h1 class="text-xl font-bold">InternConnect</h1>
        <button id="themeToggle" class="rounded-lg border border-slate-300 px-3 py-1 text-sm dark:border-slate-600">Theme</button>
      </div>
      <p class="mb-4 text-sm text-slate-500 dark:text-slate-300">Student login mockup for API-ready frontend.</p>
      <form class="space-y-3">
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2 dark:border-slate-700 dark:bg-slate-800" placeholder="Email" />
        <input class="w-full rounded-lg border border-slate-300 px-3 py-2 dark:border-slate-700 dark:bg-slate-800" type="password" placeholder="Password" />
        <select class="w-full rounded-lg border border-slate-300 px-3 py-2 dark:border-slate-700 dark:bg-slate-800">
          <option>Student</option>
        </select>
        <a class="block rounded-lg bg-blue-600 px-4 py-2 text-center font-semibold text-white" href="./student-dashboard.html">Sign in (Demo)</a>
      </form>
    </section>
    <script>
      (function () {
        const THEME_KEY = "internconnect-theme";
        const root = document.documentElement;
        const savedTheme = localStorage.getItem(THEME_KEY) || "light";
        if (savedTheme === "dark") root.classList.add("dark");
        const toggleBtn = document.getElementById("themeToggle");
        if (!toggleBtn) return;
        toggleBtn.addEventListener("click", () => {
          const nextTheme = root.classList.contains("dark") ? "light" : "dark";
          root.classList.toggle("dark");
          localStorage.setItem(THEME_KEY, nextTheme);
        });
      })();
    </script>
  </body>
</html>
