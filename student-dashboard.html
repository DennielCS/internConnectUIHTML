<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternConnect | Student Dashboard</title>
    <script>
      tailwind = { config: { darkMode: "class" } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./assets/css/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
    <div class="app-shell flex">
      <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 -translate-x-full bg-white p-4 shadow-sm transition-transform dark:bg-slate-900 md:static md:translate-x-0">
        <h2 class="mb-6 text-lg font-bold">InternConnect</h2>
        <nav class="space-y-2">
          <a class="sidebar-link active" href="./student-dashboard.html">Dashboard</a>
          <a class="sidebar-link" href="./internships.html">Browse Internships</a>
          <a class="sidebar-link" href="./my-applications.html">My Applications</a>
          <a class="sidebar-link" href="./login.html">Logout</a>
        </nav>
      </aside>
      <section class="min-w-0 flex-1 md:ml-0">
        <header class="sticky top-0 z-20 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 dark:border-slate-700 dark:bg-slate-900">
          <button id="sidebarToggle" class="rounded-lg border border-slate-300 px-3 py-1 text-sm md:hidden dark:border-slate-600">Menu</button>
          <h1 class="font-semibold">Student Dashboard</h1>
          <button id="themeToggle" class="rounded-lg border border-slate-300 px-3 py-1 text-sm dark:border-slate-600">Theme</button>
        </header>
        <main class="space-y-5 p-4">
          <div class="grid gap-4 md:grid-cols-3">
            <article class="stat-card"><p class="text-sm text-slate-500">Available Internships</p><p class="mt-2 text-2xl font-bold">126</p></article>
            <article class="stat-card"><p class="text-sm text-slate-500">Applications Sent</p><p class="mt-2 text-2xl font-bold">8</p></article>
            <article class="stat-card"><p class="text-sm text-slate-500">Active Interviews</p><p class="mt-2 text-2xl font-bold">2</p></article>
          </div>
          <article class="rounded-2xl bg-white p-5 dark:bg-slate-900">
            <h2 class="text-lg font-semibold">Quick Actions</h2>
            <div class="mt-4 flex flex-wrap gap-3">
              <a class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white" href="./internships.html">Find Internship</a>
              <a class="rounded-lg border border-slate-300 px-4 py-2 text-sm dark:border-slate-600" href="./my-applications.html">Track Applications</a>
            </div>
          </article>
        </main>
      </section>
    </div>
    <script>
      (function () {
        const THEME_KEY = "internconnect-theme";
        const root = document.documentElement;
        const savedTheme = localStorage.getItem(THEME_KEY) || "light";
        if (savedTheme === "dark") root.classList.add("dark");

        const toggleBtn = document.getElementById("themeToggle");
        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => {
            const nextTheme = root.classList.contains("dark") ? "light" : "dark";
            root.classList.toggle("dark");
            localStorage.setItem(THEME_KEY, nextTheme);
          });
        }

        const sidebar = document.getElementById("sidebar");
        const sidebarToggle = document.getElementById("sidebarToggle");
        if (sidebar && sidebarToggle) {
          sidebarToggle.addEventListener("click", () => {
            sidebar.classList.toggle("-translate-x-full");
          });
        }
      })();
    </script>
  </body>
</html>
